[project]
name = "dl-project"
version = "0.1.0"
description = "Base deep learning project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ==== Base ====
    ## utils
    "notebook",
    "ipywidgets",
    ## log
    "loguru",
    ## path
    "pathlib",
    "omegaconf",

    # ===== Main =====
    ## ===== Torch =====
    "torch",
    # "torchvision",
    # "torchaudio",
    ## ===== Logger =====
    "wandb",
    "tensorboard",
    ## ===== Config =====
    "hydra-core",
]


[dependency-groups]
# Data Processing
data = [
    # structured data
    "polars",
    # "pandas", "pandas-stubs",
    # stream data
    "jsonlines",
    # compatibility
    ## json related
    "orjson",
    "ujson",
    ## xlsx
    # "openyxl",
]
# Training
training = [
    # ===== NLP =====
    # "sentencepiece",
    # ===== CV =====
    # "opencv-python",
    # "moviepy",
    # ===== Audio =====
    # "soundfile",
]
# Lightning
lightning = [
    # ===== Main =====
    ## ===== Lightning =====
    "lightning",
    "torchmetrics",
]
# tTransformers
transformers = [
    # ===== Main =====
    ## ===== Transformers =====
    ### Base
    "transformers",
    # "sentence-transformers",
    ### Dataset
    "datasets",
    ### Training
    "accelerate",
    "trl",
    "peft",
    ### Evaluation
    "lighteval",
    ## ===== Integration Tools =====
    "unsloth",
]
# Development
dev = [
    # ===== Linting and Formatting =====
    "ruff",
    # "mypy",
    # "pyright",
    # ===== Debugging and Dev Productivity =====
    # "ipython",
    # "pre-commit",
]
# Tests
test = [
    # pytest
    "pytest",
    "pytest-asyncio",  # if only asyncio instead of anyio
]
# Documents
docs = [
    # Sphinx
    # "sphinx",
    # "sphinx-rtd-theme",
    # "myst-parser",
    # MkDocs
    # "mkdocs",
    # "mkdocs-material",
    # "mkdocstrings",
]


[tool.uv]
default-groups = ["dev", "test", ]


[tool.ruff]
select = ["E", "F", ]
ignore = [
    "F401",
]
format.quote-style = "preserve"


[tool.pytest.ini_options]
asyncio_mode = "auto"

