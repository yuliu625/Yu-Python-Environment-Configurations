[project]
name = "ds-project"
version = "0.1.0"
description = "Base data science project."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ==== Base ====
    ## utils
    "notebook",
    "ipywidgets",
    ## log
    "loguru",
    ## path
    "pathlib",
    # "omegaconf",

    # ===== Main =====
    ## Data Processing, Analysis, Modeling
    "polars",
    # "pandas", "pandas-stubs",
    "scipy", "scipy-stubs",
    "statsmodels",
    "scikit-learn",  # sklearn
    ## Pipeline
    # "luigi",
    # "snakemake",
    # "apache-airflow",
    # ==== Compatibility ====
    ## Json Related
    "orjson", "ujson",  # for json & jsonlines
    ## xlsx
    # "openyxl",
    "fastexcel", "xlsxwriter",  # for polars
]


[dependency-groups]
# Regression Analysis
## Linear Regression
regression = [
    "tabuleone",
]
# Text Analysys
text = [
    "nltk",
    "spacy",
    # "gensim",
    "jieba",
]
# Visualization
visualization = [
    # "matplotlib",
    # "seaborn",
    "plotly", "kaleido",
]
# Development
dev = [
    # ===== Linting and Formatting =====
    "ruff",
    # "mypy",
    # "pyright",
    # ===== Debugging and Dev Productivity =====
    # "ipython",
    # "pre-commit",
]
# Tests
test = [
    # pytest
    "pytest",
    "pytest-asyncio",  # if only asyncio instead of anyio
]
# Documents
docs = [
    # Sphinx
    # "sphinx",
    # "sphinx-rtd-theme",
    # "myst-parser",
    # MkDocs
    # "mkdocs",
    # "mkdocs-material",
    # "mkdocstrings",
]


[tool.uv]
default-groups = ["dev", "test", ]


[tool.ruff]
select = ["E", "F", ]
ignore = [
    "F401",
]
format.quote-style = "preserve"


[tool.pytest.ini_options]
asyncio_mode = "auto"

